apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexvion-ecommerce
  namespace: nexvion
  labels:
    app: nexvion-ecommerce
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nexvion-ecommerce
  template:
    metadata:
      labels:
        app: nexvion-ecommerce
    spec:
      containers:
        - name: nexvion-ecommerce
          image: docker.io/library/nexvion-ecommerce:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: nexvion-config
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 15
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
