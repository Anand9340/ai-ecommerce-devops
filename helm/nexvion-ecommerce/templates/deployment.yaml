apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexvion-ecommerce.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "nexvion-ecommerce.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ include "nexvion-ecommerce.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "nexvion-ecommerce.fullname" . }}
    spec:
      containers:
        - name: nexvion-ecommerce
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: {{ include "nexvion-ecommerce.fullname" . }}-config
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 15
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
